# Netlify 설정 — Netlify가 이 저장소를 보고 있으면 푸시할 때마다 이 설정대로 올라간다.
# 저장소의 site/ 폴더는 Cloudflare(findinside.pages.dev) 주소로 되어 있다.
# Netlify(findinside.netlify.app)에는 주소를 netlify.app으로 바꾼 복사본(release/site-netlify)을 올린다.
# 두 사이트는 서로 넘기지 않고 각각 자기 주소를 쓴다.
[build]
  command = "node scripts/site-netlify.js"
  publish = "release/site-netlify"

# 설치 파일 링크(/download/Find_Setup_v<버전>.exe): Cloudflare는 functions/download가 GitHub에서 받아 넘겨주지만,
# Netlify에는 그 함수가 없으므로 GitHub 릴리스 첨부로 넘긴다 (전처럼 출처는 github.com이 된다).
[[redirects]]
  from = "/download/:file"
  to = "https://github.com/kimheunghan/findinside-download/releases/latest/download/:file"
  status = 302
