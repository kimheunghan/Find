<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FindInside</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="appMenu" aria-label="애플리케이션 메뉴">
      <button type="button" data-menu="file">파일</button>
      <button type="button" data-menu="edit">편집</button>
      <button type="button" data-menu="view">보기</button>
      <button type="button" data-action="about">도움말</button>
      <div id="menuPopup" class="menuPopup" hidden></div>
    </nav>
    <aside class="sidebar">
      <div class="brand"><span>F</span> FindInside</div>
      <p class="tagline">이름을 몰라도, 기억나는 내용으로.</p>
      <section>
        <h2>검색 위치</h2>
        <div id="roots" class="roots"></div>
        <button id="addRoot" class="secondary">+ 폴더 추가</button>
      </section>
      <section>
        <h2>제외 폴더</h2>
        <div id="excludes" class="roots"></div>
        <button id="addExclude" class="secondary">+ 제외 폴더 추가</button>
      </section>
      <section>
        <h2>메일 계정</h2>
        <div id="mailAccounts" class="roots"></div>
        <button id="addMailAccount" class="secondary">+ 메일 계정 추가</button>
        <button id="syncMail" class="linkButton syncMail" hidden>지금 새 메일 가져오기</button>
        <div id="mailStatus" class="status"></div>
      </section>
      <button id="reindex" class="primary">색인 시작</button>
      <div id="indexStatus" class="status">색인을 불러오는 중…</div>
    </aside>

    <main>
      <header>
        <label class="searchBox">
          <span>⌕</span>
          <input id="query" type="search" placeholder="파일명, 경로, 파일 내용 또는 메일 검색" autocomplete="off" />
        </label>
        <div class="sourceTabs" role="tablist" aria-label="검색 분류">
          <button type="button" role="tab" data-source="all" aria-selected="true">전체 <span data-count="all"></span></button>
          <button type="button" role="tab" data-source="pc" aria-selected="false">PC 파일 <span data-count="pc"></span></button>
          <button type="button" role="tab" data-source="mail" aria-selected="false">메일 <span data-count="mail"></span></button>
        </div>
        <div class="filterBar">
          <button id="toggleFilters" type="button" class="filterToggle" aria-expanded="false" aria-controls="filterPanel">상세 조건 펼치기 ▾</button>
          <div id="filterChips" class="chips" aria-label="적용 중인 조건"></div>
          <button id="clearFilters" type="button" class="linkButton clearFilters" hidden>조건 초기화</button>
        </div>
      </header>

      <div id="mailPanel" class="mailPanel" hidden></div>
      <div id="filterPanel" class="filterPanel" hidden>
          <div class="filterRow">
            <h3>검색 범위</h3>
            <div>
              <div class="scopeControls">
                <div id="scopeOptions" class="optionButtons"></div>
                <button id="addScope" type="button" class="optionButton">폴더 선택…</button>
              </div>
              <p class="filterHelp">선택한 드라이브나 폴더 안의 항목만 검색합니다. 여러 개를 고르면 그중 한 곳에만 있어도 결과에 나옵니다.</p>
            </div>
          </div>
          <div class="filterRow">
            <h3>확장자</h3>
            <div class="extensionControls">
              <select id="extensionSelect" class="extensionSelect" aria-label="파일 형식">
                <option value="">+ 형식 추가</option>
                <option value="hwp">HWP</option>
                <option value="hwpx">HWPX</option>
                <option value="doc">DOC</option>
                <option value="docx">DOCX</option>
                <option value="xls">XLS</option>
                <option value="xlsx">XLSX</option>
                <option value="ppt">PPT</option>
                <option value="pptx">PPTX</option>
                <option value="pdf">PDF</option>
                <option value="txt">TXT</option>
                <option value="csv">CSV</option>
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="jpeg">JPEG</option>
                <option value="gif">GIF</option>
                <option value="webp">WEBP</option>
                <option value="bmp">BMP</option>
                <option value="tif">TIF</option>
                <option value="tiff">TIFF</option>
              </select>
              <div id="extensionTags" class="tagInput" title="확장자를 여러 개 넣을 수 있습니다. 필요 없는 것은 ×로 지웁니다.">
                <input id="extensionInput" class="tagInputField" type="text" placeholder="확장자 입력 후 Enter (예: hwp)" autocomplete="off" />
              </div>
            </div>
          </div>
      </div>

      <section class="summary">
        <div><strong id="resultCount">0</strong><span>검색 결과</span></div>
        <p id="hint">폴더를 색인한 뒤 검색어를 입력하세요.</p>
      </section>

      <section id="results" class="results"></section>
    </main>

    <template id="resultTemplate">
      <article class="result">
        <button class="open">
          <span class="icon"></span>
          <span class="info"><strong class="name"></strong><small class="path"></small></span>
          <span class="type"></span>
        </button>
        <button class="show" title="폴더에서 보기">위치 열기</button>
        <ul class="hits"></ul>
      </article>
    </template>

    <dialog id="mailDialog" class="mailDialog">
      <form id="mailForm" method="dialog">
        <div class="mailBody">
          <h3 id="mailDialogTitle">메일 계정 연결</h3>
          <label>메일 서비스
            <select name="preset">
              <option value="mailplug">메일플러그 (회사 메일)</option>
              <option value="naver">네이버 메일</option>
              <option value="daum">다음·카카오 메일</option>
              <option value="gmail">Gmail</option>
              <option value="outlook">Outlook.com·Hotmail</option>
              <option value="">직접 입력</option>
            </select>
          </label>
          <label>이메일 주소<input name="email" type="email" required placeholder="kim@company.com" /></label>
          <label>비밀번호<input name="password" type="password" /></label>
          <p id="mailPresetNote" class="filterHelp"></p>
          <details id="mailAdvanced">
            <summary>고급 설정</summary>
            <label>연결 방식
              <select name="protocol">
                <option value="imap">IMAP (모든 폴더)</option>
                <option value="pop3">POP3 (받은편지함만)</option>
              </select>
            </label>
            <label><span id="mailHostLabel">IMAP 서버</span><input name="host" required /></label>
            <div class="mailRow">
              <label>보안 방식
                <select name="security">
                  <option value="ssl">SSL/TLS</option>
                  <option value="starttls">STARTTLS</option>
                  <option value="none">없음 (암호화 안 함)</option>
                </select>
              </label>
              <label>포트<input name="port" type="number" required value="993" /></label>
            </div>
            <p id="mailNoTls" class="mailWarn" hidden>⚠ 비밀번호와 메일이 암호화되지 않은 채 전송됩니다.</p>
            <label>아이디<input name="user" placeholder="비우면 이메일 주소" /></label>
            <label>표시 이름<input name="name" placeholder="비우면 이메일 주소" /></label>
            <label class="mailCheck"><input name="allowSelfSigned" type="checkbox" /> 사내 서버의 자체 서명 인증서 허용</label>
          </details>
          <p id="mailTestResult" class="filterHelp"></p>
        </div>
        <div class="mailButtons">
          <button type="button" id="mailTest" class="secondary">연결 시험</button>
          <button type="button" id="mailCancel" class="secondary">취소</button>
          <button type="submit" id="mailSave" class="primary">저장</button>
        </div>
      </form>
    </dialog>

    <script src="highlight.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
